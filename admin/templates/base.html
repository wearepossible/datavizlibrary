<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Possible Dataviz Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <!-- ── Sticky header with nav ── -->
  <header>
    <div class="header-inner">
      <div class="header-left">
        <a href="{{ url_for('index') }}" class="logo-link">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="Possible" class="logo">
        </a>
        <span class="header-subtitle">Dataviz Admin</span>
      </div>
      <nav>
        <a href="{{ url_for('index') }}">Records</a>
        <a href="{{ url_for('add') }}" class="btn-add">+ Add New</a>
      </nav>
    </div>
  </header>

  <!-- ── Flash messages (success/error banners after form actions) ── -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
