<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Prevent search engine indexing — this is an internal tool -->
  <meta name="robots" content="noindex, nofollow">
  <title>Data Visualization Library — Possible</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── Header with logo + search ── -->
  <header>
    <div class="header-inner">
      <div class="header-brand">
        <a href="/" class="logo-link">
          <img src="logo.png" alt="Possible" class="logo">
        </a>
        <span class="header-subtitle">Dataviz Library</span>
      </div>
      <div class="header-search">
        <input type="text" id="search" placeholder="Search headlines, campaigns, tags..." autofocus>
      </div>
    </div>
  </header>

  <!-- ── Card grid (populated by app.js) ── -->
  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">No results found.</div>
  </main>

  <!-- ── Lightbox overlay (shown when a card is clicked) ── -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-meta">
        <h2 id="lightbox-title"></h2>
        <div id="lightbox-details"></div>
        <div id="lightbox-links" class="lightbox-links"></div>
      </div>
    </div>
  </div>

  <!-- ── Password gate ──
       Client-side SHA-256 hash check.  This is a lightweight barrier for
       an internal tool, not a security boundary.  Auth state is stored in
       sessionStorage so it persists across page refreshes within a tab. -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-box">
      <img src="logo.png" alt="Possible" class="auth-logo">
      <h1>Dataviz Library</h1>
      <form id="auth-form">
        <input type="password" id="auth-password" placeholder="Password" autofocus>
        <button type="submit">Enter</button>
      </form>
      <div id="auth-error" class="auth-error hidden">Incorrect password</div>
      <div class="auth-hint">If you don't know the password, ask Duncan.</div>
    </div>
  </div>

  <script>
  // Password gate: compare SHA-256 hash of user input against stored hash.
  // On success, hide the gate and store a flag in sessionStorage.
  (function() {
    const PASS_HASH = 'd5be2d831e628a91bbb642604713ea9500a2c9a86f372dfedae429c6c3762ddd';
    const gate = document.getElementById('auth-gate');

    async function hashPass(pw) {
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Skip the gate if already authenticated this session
    if (sessionStorage.getItem('dvl_auth') === 'ok') {
      gate.classList.add('hidden');
      document.getElementById('search').focus();
    } else {
      document.body.classList.add('locked');
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pw = document.getElementById('auth-password').value;
      const hash = await hashPass(pw);
      if (hash === PASS_HASH) {
        sessionStorage.setItem('dvl_auth', 'ok');
        gate.classList.add('hidden');
        document.body.classList.remove('locked');
        document.getElementById('search').focus();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    });
  })();
  </script>

  <!-- Main application logic (search, grid rendering, lightbox) -->
  <script src="app.js?v=2"></script>
</body>
</html>
